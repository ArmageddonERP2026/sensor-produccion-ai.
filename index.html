<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>ERP AI · Sensor de Producción</title>

<style>
:root{
  --bg:#07111f;
  --card:#0d1b2a;
  --line:#20344a;
  --txt:#eef6ff;
  --muted:#8fa6bd;
  --cyan:#12d8d0;
  --green:#29d17d;
  --red:#ff5364;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--txt);
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

body{
  min-height:100vh;
}

header{
  width:100%;
  padding:15px 16px;
  background:#091522;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:18px;
  font-weight:900;
}

.state{
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

main{
  width:100%;
  max-width:600px;
  margin:0 auto;
  padding:12px;
}

.card{
  width:100%;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}

h2{
  margin:0 0 12px;
  font-size:19px;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  max-height:62vh;
  background:#000;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  z-index:5;
  background:#003437;
  color:#7ffff8;
  padding:7px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.line{
  position:absolute;
  left:0;
  right:0;
  top:55%;
  height:3px;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
  z-index:4;
}

.signal{
  position:absolute;
  left:10px;
  top:calc(55% + 10px);
  z-index:5;
  background:rgba(0,20,30,.85);
  padding:6px 8px;
  font-size:11px;
  border-radius:4px;
}

.field{
  margin-bottom:16px;
}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  padding:13px;
  background:#091522;
  color:var(--txt);
  border:1px solid var(--line);
  border-radius:12px;
  font-size:16px;
}

input[type=range]{
  padding:0;
  accent-color:#168cff;
}

.rangeRow{
  display:grid;
  grid-template-columns:1fr 65px;
  align-items:center;
  gap:10px;
}

.value{
  text-align:right;
  font-size:16px;
  font-weight:bold;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px 12px;
  margin-top:9px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.primary{
  background:var(--cyan);
  color:#001b20;
}

.secondary{
  background:#15283a;
  color:var(--txt);
  border:1px solid var(--line);
}

.danger{
  background:#3a1720;
  color:#ff9aa5;
}

button:disabled{
  opacity:.4;
}

.metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.metric{
  background:#091522;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}

.metric span{
  display:block;
  color:var(--muted);
  font-size:11px;
}

.metric strong{
  display:block;
  margin-top:5px;
  font-size:21px;
}

.status{
  margin-top:12px;
  padding:10px;
  background:#091522;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--muted);
  font-size:12px;
}

.ok{
  color:var(--green);
}

.bad{
  color:var(--red);
}

/* IMPORTANTE:
   Nunca convertir la interfaz a dos columnas en móvil */
@media (max-width:900px){
  main{
    display:block !important;
    width:100% !important;
    max-width:600px !important;
  }

  .card{
    width:100% !important;
  }
}

/* Escritorio solamente */
@media (min-width:901px){
  main{
    max-width:600px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">📷 ERP AI · SENSOR V6</div>
  <div class="state" id="topState">DETENIDO</div>
</header>

<main>

<section class="card">
  <h2>Detección óptica de cajas</h2>

  <div class="camera" id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div class="badge">
      LÍNEA VIRTUAL DE CONTEO
    </div>

    <div class="line" id="virtualLine"></div>

    <div class="signal" id="signal">
      Señal: 0.0 / umbral 28
    </div>
  </div>

  <div class="metrics">
    <div class="metric">
      <span>CAJAS DETECTADAS</span>
      <strong id="count">0</strong>
    </div>

    <div class="metric">
      <span>SEÑAL</span>
      <strong id="signalValue">0.0</strong>
    </div>
  </div>
</section>

<section class="card">

  <h2>Configuración del nodo</h2>

  <div class="field">
    <label>Máquina</label>
    <select id="machine">
      <option>Flexo 1</option>
      <option>Flexo 2</option>
      <option>Troqueladora</option>
      <option>Pegadora</option>
    </select>
  </div>

  <div class="field">
    <label>OP activa</label>
    <input
      id="op"
      type="text"
      inputmode="numeric"
      placeholder="Ej. 1021">
  </div>

  <div class="field">
    <label>Posición de línea de detección</label>

    <div class="rangeRow">
      <input
        id="lineY"
        type="range"
        min="15"
        max="85"
        value="55">

      <div class="value" id="lineValue">55%</div>
    </div>
  </div>

  <div class="field">
    <label>Sensibilidad</label>

    <div class="rangeRow">
      <input
        id="threshold"
        type="range"
        min="5"
        max="100"
        value="28">

      <div class="value" id="thresholdValue">28</div>
    </div>
  </div>

  <div class="field">
    <label>Separación mínima entre cajas</label>

    <div class="rangeRow">
      <input
        id="delay"
        type="range"
        min="100"
        max="2000"
        step="50"
        value="500">

      <div class="value" id="delayValue">500 ms</div>
    </div>
  </div>

  <button class="primary" id="cameraBtn">
    1 · ABRIR CÁMARA
  </button>

  <button class="secondary" id="sensorBtn" disabled>
    2 · INICIAR SENSOR
  </button>

  <button class="danger" id="stopBtn">
    DETENER
  </button>

  <div class="status" id="status">
    Cámara: esperando autorización
  </div>

</section>

</main>

<script>
const $ = id => document.getElementById(id);

const video = $('video');
const overlay = $('overlay');
const ctx = overlay.getContext('2d');

let stream = null;
let sensing = false;
let animationId = null;

let count = 0;
let previousSignal = 0;
let lastDetection = 0;

function resizeCanvas(){
  const rect = $('cameraBox').getBoundingClientRect();

  overlay.width = Math.max(
    1,
    Math.round(rect.width * devicePixelRatio)
  );

  overlay.height = Math.max(
    1,
    Math.round(rect.height * devicePixelRatio)
  );
}

window.addEventListener('resize',resizeCanvas);

$('lineY').oninput = function(){
  $('lineValue').textContent = this.value + '%';
  $('virtualLine').style.top = this.value + '%';
  $('signal').style.top =
    'calc(' + this.value + '% + 10px)';
};

$('threshold').oninput = function(){
  $('thresholdValue').textContent = this.value;
};

$('delay').oninput = function(){
  $('delayValue').textContent =
    this.value + ' ms';
};

async function startCamera(){

  $('cameraBtn').disabled = true;
  $('cameraBtn').textContent =
    'ABRIENDO CÁMARA...';

  $('status').textContent =
    'Solicitando permiso de cámara...';

  try{

    if(stream){
      stream.getTracks().forEach(
        track => track.stop()
      );
    }

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio:false,

        video:{
          facingMode:{
            ideal:'environment'
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }
        }
      });

    video.srcObject = stream;

    await video.play();

    resizeCanvas();

    $('cameraBtn').textContent =
      '✓ CÁMARA ACTIVA';

    $('sensorBtn').disabled = false;

    $('topState').textContent =
      'CÁMARA ACTIVA';

    $('status').innerHTML =
      'Cámara: <span class="ok">ACTIVA</span>' +
      '<br>' +
      video.videoWidth +
      ' × ' +
      video.videoHeight;

  }catch(error){

    console.error(error);

    $('cameraBtn').disabled = false;

    $('cameraBtn').textContent =
      'REINTENTAR CÁMARA';

    $('topState').textContent =
      'ERROR';

    $('status').innerHTML =
      '<span class="bad">ERROR DE CÁMARA</span><br>' +
      error.name +
      ': ' +
      error.message;
  }
}

function calculateSignal(){

  if(
    video.readyState < 2 ||
    !video.videoWidth ||
    !video.videoHeight
  ){
    return 0;
  }

  const w = overlay.width;
  const h = overlay.height;

  if(!w || !h){
    return 0;
  }

  ctx.clearRect(0,0,w,h);

  /*
    El video se analiza directamente.
    NO se rota la interfaz.
  */

  ctx.drawImage(
    video,
    0,
    0,
    w,
    h
  );

  const percent =
    Number($('lineY').value) / 100;

  const y =
    Math.min(
      h - 3,
      Math.max(
        0,
        Math.round(h * percent)
      )
    );

  const sampleHeight =
    Math.min(6,h-y);

  if(sampleHeight <= 0){
    return 0;
  }

  const data =
    ctx.getImageData(
      0,
      y,
      w,
      sampleHeight
    ).data;

  let total = 0;
  let pixels = 0;

  for(
    let i=0;
    i<data.length;
    i+=16
  ){

    const r=data[i];
    const g=data[i+1];
    const b=data[i+2];

    const brightness =
      (r+g+b)/3;

    total += brightness;
    pixels++;
  }

  if(!pixels){
    return 0;
  }

  return total/pixels;
}

function sensorLoop(time){

  if(!sensing){
    return;
  }

  const current =
    calculateSignal();

  const difference =
    Math.abs(
      current -
      previousSignal
    );

  previousSignal =
    previousSignal * 0.75 +
    current * 0.25;

  const threshold =
    Number(
      $('threshold').value
    );

  const delay =
    Number(
      $('delay').value
    );

  $('signalValue').textContent =
    difference.toFixed(1);

  $('signal').textContent =
    'Señal: ' +
    difference.toFixed(1) +
    ' / umbral ' +
    threshold;

  if(
    difference > threshold &&
    time-lastDetection > delay
  ){

    count++;

    $('count').textContent =
      count;

    lastDetection = time;

    $('status').innerHTML =
      '<span class="ok">' +
      'CAJA DETECTADA · TOTAL ' +
      count +
      '</span>';
  }

  animationId =
    requestAnimationFrame(
      sensorLoop
    );
}

function startSensor(){

  if(!stream){
    alert(
      'Primero abre la cámara.'
    );
    return;
  }

  if(!$('op').value.trim()){

    const continuar =
      confirm(
        'No ingresaste una OP. ¿Iniciar de todas formas?'
      );

    if(!continuar){
      return;
    }
  }

  sensing = true;

  count = 0;

  previousSignal = 0;

  lastDetection = 0;

  $('count').textContent = '0';

  $('sensorBtn').disabled = true;

  $('cameraBtn').disabled = true;

  $('topState').textContent =
    'SENSOR ACTIVO';

  $('status').innerHTML =
    '<span class="ok">' +
    'SENSOR EN PRODUCCIÓN' +
    '</span>';

  animationId =
    requestAnimationFrame(
      sensorLoop
    );
}

function stopEverything(){

  sensing = false;

  if(animationId){
    cancelAnimationFrame(
      animationId
    );
  }

  if(stream){
    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  stream = null;

  video.srcObject = null;

  $('cameraBtn').disabled = false;

  $('cameraBtn').textContent =
    '1 · ABRIR CÁMARA';

  $('sensorBtn').disabled = true;

  $('topState').textContent =
    'DETENIDO';

  $('status').textContent =
    'Sensor detenido';
}

$('cameraBtn').onclick =
  startCamera;

$('sensorBtn').onclick =
  startSensor;

$('stopBtn').onclick =
  stopEverything;

resizeCanvas();
</script>

</body>
</html>
