<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>ERP Producción AI · Cámara Sensor V5</title>

<style>
:root{
  --bg:#07111f;
  --card:#0d1b2a;
  --line:#20344a;
  --txt:#eef6ff;
  --muted:#8fa6bd;
  --cyan:#12d8d0;
  --green:#29d17d;
  --red:#ff5364;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:Arial,sans-serif;
}
header{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  padding:12px 14px;
  background:#091522;
  border-bottom:1px solid var(--line);
}
.logo{
  font-weight:900;
  font-size:18px;
}
.pill{
  margin-left:auto;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 14px;
  color:var(--muted);
  font-size:13px;
}
main{
  max-width:1200px;
  margin:auto;
  padding:14px;
}
.grid{
  display:grid;
  grid-template-columns:1.45fr .8fr;
  gap:14px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
}
.title{
  font-size:18px;
  font-weight:900;
  margin-bottom:12px;
}
.camera{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#02070d;
  overflow:hidden;
  border-radius:14px;
  border:1px solid var(--line);
}
#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}
#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
.lineLabel{
  position:absolute;
  left:10px;
  top:10px;
  z-index:4;
  background:#001c20cc;
  color:#8ffff0;
  padding:6px 9px;
  border-radius:8px;
  font-weight:bold;
  font-size:13px;
}
.signal{
  position:absolute;
  left:10px;
  z-index:4;
  background:#00131dcc;
  padding:5px 8px;
  font-size:12px;
}
.controls{
  display:grid;
  gap:12px;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
label{
  display:block;
  color:var(--muted);
  margin-bottom:6px;
  font-size:13px;
}
select,input[type=text]{
  width:100%;
  background:#091522;
  color:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  font-size:16px;
}
.range{
  display:flex;
  align-items:center;
  gap:10px;
}
.range input{flex:1}
.value{
  min-width:58px;
  text-align:right;
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  font-weight:900;
  font-size:15px;
}
.primary{
  background:var(--cyan);
  color:#002120;
}
.secondary{
  background:#172a3d;
  color:white;
}
.danger{
  background:var(--red);
  color:white;
}
button:disabled{
  opacity:.4;
}
.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:12px;
}
.stat{
  background:#091522;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}
.big{
  font-size:28px;
  font-weight:900;
}
.small{
  color:var(--muted);
  font-size:12px;
}
#events{
  margin-top:12px;
  height:120px;
  overflow:auto;
  background:#07111f;
  border-radius:10px;
  padding:8px;
  font-family:monospace;
  font-size:11px;
}
.event{
  padding:4px;
  border-bottom:1px solid #16283a;
}
@media(max-width:800px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="logo">📷 ERP AI · CÁMARA SENSOR V5</div>
  <div class="pill" id="topState">DETENIDO</div>
</header>

<main>
<div class="grid">

<section class="card">
  <div class="title">Detección óptica de cajas</div>

  <div class="camera" id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div class="lineLabel">LÍNEA VIRTUAL DE CONTEO</div>
    <div class="signal" id="signal">Señal: 0.0 / umbral 28</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="small">Cajas detectadas</div>
      <div class="big" id="count">0</div>
    </div>
    <div class="stat">
      <div class="small">Velocidad</div>
      <div class="big"><span id="speed">0</span> <small>cpm</small></div>
    </div>
  </div>

  <div id="events"></div>
</section>

<aside class="card controls">

  <div class="title">Configuración del nodo</div>

  <div class="row">
    <div>
      <label>Máquina</label>
      <select id="machine">
        <option>Flexo 1</option>
        <option>Flexo 2</option>
        <option>Troqueladora</option>
        <option>Pegadora</option>
      </select>
    </div>

    <div>
      <label>OP activa</label>
      <input id="op" type="text" placeholder="Ej. 1021">
    </div>
  </div>

  <div>
    <label>Posición de línea de detección</label>
    <div class="range">
      <input id="lineY" type="range" min="10" max="90" value="55">
      <span class="value"><span id="lineYV">55</span>%</span>
    </div>
  </div>

  <div>
    <label>Sensibilidad</label>
    <div class="range">
      <input id="threshold" type="range" min="5" max="80" value="28">
      <span class="value" id="thresholdV">28</span>
    </div>
  </div>

  <div>
    <label>Separación mínima entre cajas</label>
    <div class="range">
      <input id="cooldown" type="range" min="100" max="2000" step="20" value="500">
      <span class="value"><span id="cooldownV">500</span> ms</span>
    </div>
  </div>

  <button class="primary" id="cameraBtn">1 · ACTIVAR CÁMARA</button>
  <button class="secondary" id="sensorBtn" disabled>2 · INICIAR SENSOR</button>
  <button class="danger" id="stopBtn" disabled>DETENER SENSOR</button>

</aside>

</div>
</main>

<canvas id="hidden" style="display:none"></canvas>

<script>
const $ = id => document.getElementById(id);

const video = $('video');
const overlay = $('overlay');
const ctx = overlay.getContext('2d');

const hidden = $('hidden');
const hctx = hidden.getContext('2d', {willReadFrequently:true});

let stream = null;
let sensing = false;
let raf = 0;

let prevStrip = null;
let motionEMA = 0;
let lastDetect = 0;
let count = 0;
let timestamps = [];

function log(text){
  const d=document.createElement('div');
  d.className='event';
  d.textContent=new Date().toLocaleTimeString()+' · '+text;
  $('events').prepend(d);
}

function resizeOverlay(){
  const r=$('cameraBox').getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;

  overlay.width=Math.round(r.width*dpr);
  overlay.height=Math.round(r.height*dpr);
  overlay.style.width=r.width+'px';
  overlay.style.height=r.height+'px';

  drawOverlay();
}

function drawOverlay(){
  const dpr=window.devicePixelRatio||1;
  const w=overlay.width;
  const h=overlay.height;
  const y=h*(Number($('lineY').value)/100);

  ctx.clearRect(0,0,w,h);

  ctx.strokeStyle='#12d8d0';
  ctx.lineWidth=3*dpr;
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(w,y);
  ctx.stroke();

  $('signal').style.top=
    Math.min(
      $('cameraBox').clientHeight-32,
      $('cameraBox').clientHeight*(Number($('lineY').value)/100)+8
    )+'px';
}

$('lineY').oninput=()=>{
  $('lineYV').textContent=$('lineY').value;
  drawOverlay();
};

$('threshold').oninput=()=>{
  $('thresholdV').textContent=$('threshold').value;
};

$('cooldown').oninput=()=>{
  $('cooldownV').textContent=$('cooldown').value;
};

async function startCamera(){

  const btn=$('cameraBtn');
  btn.disabled=true;
  btn.textContent='ABRIENDO CÁMARA...';

  try{

    if(stream){
      stream.getTracks().forEach(t=>t.stop());
    }

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    video.srcObject=stream;

    await video.play();

    await new Promise(resolve=>{
      if(video.videoWidth>0) resolve();
      else video.onloadedmetadata=resolve;
    });

    hidden.width=320;
    hidden.height=180;

    resizeOverlay();

    btn.textContent='✓ CÁMARA ACTIVA';
    btn.disabled=false;

    $('sensorBtn').disabled=false;
    $('topState').textContent='CÁMARA ACTIVA';

    log(
      'Cámara activa · '+
      video.videoWidth+' × '+video.videoHeight
    );

  }catch(e){

    console.error(e);

    btn.disabled=false;
    btn.textContent='REINTENTAR CÁMARA';

    $('topState').textContent='ERROR CÁMARA';

    log('ERROR cámara: '+e.name+' · '+e.message);

    alert(
      'No se pudo abrir la cámara.\n\n'+
      e.name+'\n'+e.message
    );
  }
}

function detectFrame(){

  if(video.readyState<2) return;

  /*
   IMPORTANTE:
   Aquí NO rotamos el video.
   Se procesa exactamente la misma imagen
   que Chrome entrega y muestra.
  */
  hctx.drawImage(
    video,
    0,0,
    hidden.width,
    hidden.height
  );

  const yPct=Number($('lineY').value)/100;
  const y=Math.floor(hidden.height*yPct);

  const band=10;

  const img=hctx.getImageData(
    0,
    Math.max(0,y-Math.floor(band/2)),
    hidden.width,
    band
  ).data;

  const gray=new Uint8Array(hidden.width*band);

  for(let i=0,j=0;i<img.length;i+=4,j++){
    gray[j]=(
      img[i]*0.299+
      img[i+1]*0.587+
      img[i+2]*0.114
    )|0;
  }

  let motion=0;

  if(prevStrip){
    for(let i=0;i<gray.length;i++){
      motion+=Math.abs(gray[i]-prevStrip[i]);
    }
    motion/=gray.length;
  }

  prevStrip=gray;

  motionEMA=motionEMA*0.65+motion*0.35;

  const threshold=Number($('threshold').value);
  const cooldown=Number($('cooldown').value);
  const now=performance.now();

  $('signal').textContent=
    'Señal: '+motionEMA.toFixed(1)+
    ' / umbral '+threshold;

  if(
    motionEMA>=threshold &&
    now-lastDetect>=cooldown
  ){
    lastDetect=now;
    count++;
    timestamps.push(now);

    $('count').textContent=count;

    log('Caja detectada #'+count);
  }

  timestamps=timestamps.filter(t=>now-t<60000);
  $('speed').textContent=timestamps.length;
}

function loop(){
  if(!sensing) return;

  detectFrame();
  drawOverlay();

  raf=requestAnimationFrame(loop);
}

function startSensor(){

  if(!stream){
    alert('Primero activa la cámara.');
    return;
  }

  sensing=true;
  prevStrip=null;
  motionEMA=0;

  $('sensorBtn').disabled=true;
  $('stopBtn').disabled=false;
  $('topState').textContent='SENSOR ACTIVO';

  log(
    'Sensor iniciado · '+
    $('machine').value+
    ($('op').value.trim()
      ? ' · OP '+$('op').value.trim()
      : '')
  );

  cancelAnimationFrame(raf);
  loop();
}

function stopSensor(){

  sensing=false;
  cancelAnimationFrame(raf);

  $('sensorBtn').disabled=false;
  $('stopBtn').disabled=true;
  $('topState').textContent='CÁMARA ACTIVA';

  log('Sensor detenido');
}

$('cameraBtn').onclick=startCamera;
$('sensorBtn').onclick=startSensor;
$('stopBtn').onclick=stopSensor;

window.addEventListener('resize',resizeOverlay);
window.addEventListener('orientationchange',()=>{
  setTimeout(resizeOverlay,300);
});

resizeOverlay();
</script>

</body>
</html>
